[project]
name = "rag-system-poc"
version = "0.1.0"
description = "Retrieval-Augmented Generation system proof of concept"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Siarhei Yaramionak", email = "s.yaramionak@hossted.com"}
]

dependencies = [
    "langchain>=1.3.0",
    "openai>=2.37.0",
    "chromadb>=1.5.0",
    "python-dotenv>=1.2.0",
    "requests>=2.34.0",
    "sentence-transformers>=5.5.0",
    "pypdf>=6.11.0",
    "torch>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
